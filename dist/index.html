;font-size:13px}.page{max-width:1280px;margin:auto;padding:40px 28px 64px}.page-heading{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}.page-heading .eyebrow{color:var(--teal);margin-bottom:10px}.page-heading p{margin-top:10px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.control-label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.card{border:1px solid var(--line);background:white;border-radius:var(--radius);padding:28px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:24px}.section-head p{font-size:13px;color:var(--muted);margin-top:6px}.kpis{display:grid;grid-template-columns:1.65fr 1fr 1fr 1fr;gap:16px;margin-bottom:24px}.kpi{padding:25px 24px;background:white;border:1px solid var(--line);border-radius:var(--radius);min-width:0}.kpi.primary{background:var(--navy);color:white;border-color:var(--navy);position:relative;overflow:hidden}.kpi.primary:after{content:"";position:absolute;width:150px;height:150px;right:-75px;top:-60px;border:28px solid #ffffff0c;border-radius:50%}.kpi-label{font-size:13px;color:var(--muted)}.kpi.primary .kpi-label,.kpi.primary .kpi-note{color:#cddcf0}.kpi-value{font-size:34px;font-weight:650;line-height:1.3;margin:12px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:-1px}.kpi.primary .kpi-value{font-size:42px}.kpi-value small{font-size:19px;margin-right:4px;font-weight:400}.kpi-note{font-size:12px;color:var(--muted)}.chart-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:24px;margin-bottom:24px}.chart-panel{min-width:0}.chart-svg{display:block;width:100%;height:auto;overflow:visible}.chart-scroll{min-width:0}.chart-values{margin-top:14px;font-size:12px;color:var(--muted)}.chart-values summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.month-values{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;font-size:13px;padding:12px 0}.month-values span{display:bloc .merchant-metric{border-right:1px solid var(--line);padding-right:28px}.merchant-metric h3{overflow-wrap:anywhere;margin:9px 0 22px}.merchant-metric .metric-amount{color:var(--teal);font-size:36px;letter-spacing:-1px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}.merchant-metric p{font-size:13px;color:var(--muted);margin-top:12px}.mini-facts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px;font-size:12px;color:var(--muted)}.mini-facts strong{display:block;font-size:18px;color:var(--ink);font-weight:600;margin-bottom:4px}.ranking-list{display:grid;grid-template-columns:1fr 1fr;gap:8px 32px}.rank{display:grid;grid-template-columns:25px 1fr auto;column-gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);min-width:0}.rank-index{color:#738297;font-size:12px;font-variant-numeric:tabular-nums}.rank-name{font-size:13px;overflow-wrap:anywhere}.rank-name small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.rank-money{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}.rank-track{grid-column:2/4;height:5px;background:#edf1f6;border-radius:3px;margin-top:10px;overflow:hidden}.rank-fill{height:100%;background:var(--navy);border-radius:3px}.records{margin-top:24px}.records summary{cursor:pointer;min-height:46px;display:flex;align-items:center;gap:10px;font-weight:600}.records summary:before{content:'+';color:var(--teal);font-size:20px;width:18px}.records[open] summary:before{content:'−'}.table-wrap{overflow-x:auto;margin-top:18px}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500;background:var(--paper)}td,th{padding:14px 12px;border-bottom:1px solid var(--line)}td:nth-child(3){min-width:180px}td:last-child,th:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}td small{display:block;color:var(--muted)}.empty{padding:44px 16px;text-align:center;color:var(--muted)}.notice{padding:12px 18px;background:#fff3d8;color:#74501c;border-radius:10px;margin-bottom:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}.launch-page{max-width:1100px;padding-top:72px}.launch-layout{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}.launch-intro .eyebrow{color:var(--teal);margin-bottom:20px}.launch-intro h1{font-size:clamp(40px,5vw,58px);line-height:1.2}.launch-intro h1 em{font-style:normal;color:var(--teal)}.launch-intro>p{color:var(--muted);margin-top:24px;max-width:340px;font-size:16px}.launch-art{height:160px;display:flex;align-items:end;gap:15px;margin-top:36px;width:300px;border-bottom:1px solid #b9c6d7;padding:0 14px}.launch-art span{width:32px;background:#b9cde2;border-radius:6px 6px 0 0}.launch-art span:nth-child(3n){background:var(--teal)}.launch-art span:nth-child(4n){background:var(--navy)}.setup{padding:36px;box-shadow:0 14px 44px #12295508}.setup h2{font-size:23px}.steps{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:11px;margin:14px 0 30px}.steps i{height:1px;flex:1;background:var(--line)}.setup label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.setup select{width:100%;margin-bottom:20px}.setup #start{width:100%;justify-content:space-between}.status{min-height:48px;margin:22px 0 12px;font-size:13px;color:var(--muted);white-space:pre-wrap}.progress{width:100%;height:6px;accent-color:var(--teal)}.setup-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.setup-bottom button{font-size:12px;min-height:44px;padding:6px 10px}.result{margin-top:30px}.result .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.result h2{font-size:18px}.result p{font-size:13px;color:var(--muted);margin-top:8px}

@media(max-width:600px){body{font-size:14px}.topbar{padding:0 20px;height:72px}.topbar-note{display:none}.page{padding:28px 16px 40px}.page-heading{align-items:start;flex-direction:column;gap:18px}.controls{width:100%;justify-content:space-between}.card{padding:22px 18px;border-radius:16px}.kpis{gap:12px}.kpi{padding:20px 16px;border-radius:16px}.kpi-value{font-size:28px}.kpi.primary .kpi-value{font-size:32px}.kpi-note{font-size:11px}.section-head{flex-wrap:wrap}.chart-scroll{overflow-x:auto}.chart-svg{min-width:440px}.donut-layout{flex-direction:column}.donut{width:190px;height:190px}.month-values{grid-template-columns:repeat(3,1fr)}.explorer-head{flex-direction:column;align-items:stretch}.explorer-title{max-width:100%}.explorer-body{grid-template-columns:1fr;gap:22px}.merchant-metric{border-right:0;border-bottom:1px solid var(--line);padding:0 0 22px}.merchant-metric h3{margin-bottom:12px}.mini-facts{margin-top:18px;grid-template-columns:repeat(3,1fr)}.merchant-tags{max-height:220px;overflow-y:auto;padding:4px}.launch-layout{grid-template-columns:1fr;gap:30px}.launch-intro h1{font-size:42px}.launch-intro>p{font-size:14px}.launch-art{display:none}.setup{padding:26px 22px}.launch-page{padding-top:32px}.rank{column-gap:10px}.legend-row{font-size:13px}}

</head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">D.</span><div>DKU ANNUAL EAT</div></div></header>
<main class="page launch-page">
<div class="launch-layout">
<div class="launch-intro"><h1>这一年的日常，<br>让<em>数字</em>讲给你听。</h1><div class="launch-art" aria-hidden="true"><span style="height:36%"></span><span style="height:61%"></span><span style="height:48%"></span><span style="height:87%"></span><span style="height:68%"></span><span style="height:100%"></span><span style="height:79%"></span></div></div>
<section class="card setup"><h2>更新你的消费记录</h2>
<label for="year">统计范围</label><select id="year"></select>
<button id="start" disabled><span>采集新数据</span><span aria-hidden="true">↗</span></button>
<p id="status" class="status" role="status" aria-live="polite">正在连接…</p><progress id="progress" class="progress" value="0" max="1" aria-label="采集进度"></progress>
<div class="setup-bottom"><button id="cancel" class="ghost" disabled>取消采集</button><button id="quit" class="ghost">退出工具</button></div>
</section></div>
<section id="result" class="card result" hidden><h2>已保存的报告</h2><label for="history" class="sr-only">选择报告</label><select id="history"></select><div id="downloads" class="actions"></div></section>
<section class="card archive-help"><h2>离线查看</h2><p>打开「查看报告.html」，可离线阅读和收藏。</p><a id="offline-link" class="button" href="../private/home.html" hidden>打开报告库</a><p id="history-warning" role="status" hidden></p><p id="empty-history">正在查找报告…</p></section>
</main><script>'use strict';
const token='LOCAL_APP_TOKEN';
const $=id=>document.getElementById(id);
const currentYear=Number(new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'}).slice(0,4));
$('year').innerHTML='<option value="all">全部年份（2022 年至今）</option>';
for(let y=currentYear;y>=2022;y--){const option=document.createElement('option');option.value=y;option.textContent=y===currentYear?`${y} 年至今`:`${y} 年`;$('year').append(option);}
let history=[],rendered='',stopped=false,failures=0;
async function api(path,body){
  const response=await fetch(path,{method:body?'POST':'GET',signal:AbortSignal.timeout(10000),headers:{'X-DKU-App':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});
  if(!response.ok){const body=await response.json();const error=new Error(body.error||'本机服务未就绪');error.status=response.status;throw error;}
  return response;
}
function link(label,url,download){const a=document.createElement('a');a.textContent=label;a.href=url;a.className='button';if(download)a.download=download;else{a.target='_blank';a.rel='noopener';}return a;}
function showReport(){
  const item=history.find(item=>item.id===$('history').value);
  if(!item)return;
  $('downloads').replaceChildren(link('查看报告 / EatTI',item.reportURL),link('保存 HTML',item.reportURL+'?download=1',item.reportName),link('导出 JSON',item.dataURL,item.file));
  $('downloads').querySelectorAll('a').forEach((a,i)=>{if(i)a.classList.add('secondary');});
}
function showHistory(state){
  const signature=JSON.stringify(state.history);
  if(signature===rendered)return;
  const selection=$('history').value;
  const previousLatest=history[0]?.id;
  history=state.history||[];rendered=signature;
  $('history').replaceChildren();
  for(const [index,item] of history.entries()){
    const option=document.createElement('option');option.value=item.id;
    option.textContent=`${index===0?'最近 · ':''}${item.start} — ${item.end}（${new Date(item.savedAt).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})} 保存）`;
    $('history').append(option);
  }
  if(previousLatest===history[0]?.id&&history.some(item=>item.id===selection))$('history').value=selection;
  $('result').hidden=!history.length;
  $('empty-history').hidden=!!history.length;
  $('empty-history').textContent='暂无报告';
  showReport();
}
$('history').onchange=showReport;
$('start').onclick=async()=>{
  $('start').disabled=true;$('status').hidden=false;
  try{await api('/api/start',{year:$('year').value==='all'?'all':Number($('year').value)});$('status').textContent='正在打开学校登录页面…';}catch(error){$('status').textContent=error.message;$('start').disabled=false;}
};
$('cancel').onclick=async()=>{try{await api('/api/cancel',{});$('status').textContent='正在取消…';}catch(error){$('status').textContent=error.message;}};
$('quit').onclick=async()=>{
  try{await api('/api/quit',{});stopped=true;disconnect('工具已退出。已保存的报告仍可通过「查看报告.html」离线打开。');}
  catch(error){$('status').hidden=false;$('status').textContent=error.message;}
};
function disconnect(message){$('status').hidden=false;$('status').textContent=message;$('progress').hidden=true;for(const id of ['start','year','cancel','quit'])$(id).disabled=true;}
async function poll(){
  if(location.protocol==='file:'){
    disconnect('采集新数据请双击「启动.cmd」；已有报告可在下方打开。');
    $('offline-link').hidden=false;$('empty-history').hidden=true;return;
  }
  if(stopped)return;
  try{
    const state=await (await api('/api/status')).json();failures=0;
    const busy=['preparing','login','collecting'].includes(state.phase);
    $('start').disabled=busy;$('year').disabled=busy;$('quit').disabled=false;$('cancel').disabled=!['login','collecting'].includes(state.phase);
    $('status').textContent=state.message;
    $('status').hidden=state.phase==='ready';$('progress').hidden=!busy;
    $('history-warning').textContent=(state.warnings||[]).join('\n');
    $('history-warning').hidden=!state.warnings?.length;
    if(state.pages){$('progress').max=state.pages;$('progress').value=state.page||0;}else{$('progress').max=1;$('progress').value=state.phase==='complete'?1:0;}
    showHistory(state);
  }catch(error){
    failures++;
    disconnect(error.status===403?'工具可能已重新启动，当前页面的连接已过期。请刷新此页恢复连接；已保存的报告不受影响。':'本机采集服务未连接。已保存的数据仍在：双击「查看报告.html」离线查看；双击「启动.cmd」恢复采集。');
  }
  if(!stopped)setTimeout(poll,failures?Math.min(1000*2**Math.min(failures,4),15000):1500);
}
void poll();
</script></body></html>
