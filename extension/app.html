<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DKU Annual Eat</title><link rel="icon" type="image/png" href="icons/icon32.png"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="extension.css"></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">D.</span><div>DKU ANNUAL EAT<small>CAMPUS LIFE, IN NUMBERS</small></div></div><button id="language-toggle" class="secondary">English</button></header>
<main class="page launch-page"><div class="launch-layout"><section class="launch-intro"><div class="eyebrow">YOUR YEAR AT THE TABLE</div><h1><span data-en="A whole year of meals.">把这一年的饭，</span><br><span data-en="One story worth sharing.">吃成一份报告。</span></h1><p class="intro-copy" data-en="Sign in on the campus card website. Collect your transactions and discover your Eat TI characters.">在校园卡网站完成登录，采集消费记录，看看属于你的 Eat TI 饭格。</p><p class="muted" data-en="Your reports stay in this browser. Export HTML or JSON to keep a backup.">报告保存在当前浏览器。导出 HTML 或 JSON，即可另外留存备份。</p><button id="open-campus" class="secondary" data-en="Open campus card website">打开校园卡网站</button></section>
<section class="card setup"><h2 data-en="Create a report">生成消费报告</h2><label for="year" data-en="Collection period">采集范围</label><select id="year"></select><div id="dates" hidden><label for="start-date" data-en="Start date">开始日期</label><input id="start-date" type="date"><label for="end-date" data-en="End date">结束日期</label><input id="end-date" type="date"></div><button id="start" data-en="Collect new data">采集新数据</button><p id="status" class="status" role="status" aria-live="polite"></p><progress id="progress" class="progress" hidden></progress><button id="cancel" class="secondary" hidden data-en="Cancel collection">取消采集</button><p class="muted setup-hint" data-en="Finish SSO and MFA in the campus tab. Keep that tab open during collection; you can close this tool page.">在校园卡标签页完成 SSO 和 MFA。采集期间保留校园卡标签页；工具页可以关闭。</p></section></div>
<section class="result"><div class="controls"><h2 data-en="My reports">我的报告</h2><label class="button secondary" for="import" data-en="Import old JSON">导入旧版 JSON</label><input id="import" class="sr-only" type="file" accept=".json,application/json" multiple></div><p id="import-status" role="status" aria-live="polite"></p><p id="empty" data-en="No saved reports yet. Collect transactions or import JSON from the old app’s private folder.">还没有报告。可以采集新数据，或导入旧应用 private 文件夹中的 JSON。</p><div id="history" class="history-list"></div></section></main>
<script src="core.js"></script><script src="storage.js"></script><script src="language.js"></script><script src="app.js"></script></body></html>
